name: Update Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # daily at noon UTC

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # build_history.py replays every past revision of prices.json, so the
          # default shallow clone is not enough.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Build price history
        run: python scripts/build_history.py

      - name: Commit prices.json and history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json history.json
          git diff --cached --quiet || git commit -m "chore: update prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
