<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Collection Price Tracker</title>
  <style>
    /* Reserve the scrollbar gutter on every tab. The short tabs (5 and 10
       cards) fit without a vertical scrollbar, and losing it widened the
       viewport by the scrollbar's width - which the centred body turned into
       a sideways jog of half that on every tab switch. Mobile browsers use
       overlay scrollbars, where the gutter is zero, so this is a no-op there. */
    html { scrollbar-gutter: stable; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      /* Widened from 920px when the trend column made it six columns: fixed
         widths plus non-wrapping headers need the extra room. */
      max-width: 1140px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.meta { font-size: 0.85rem; color: #666; margin-top: 0; margin-bottom: 0; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 16px 0 0;
      flex-wrap: wrap;
    }
    #refresh-btn {
      padding: 8px 18px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #refresh-btn:hover { background: #1447c0; }
    #refresh-btn:disabled { background: #6b9aed; cursor: not-allowed; }
    #refresh-btn .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    #refresh-btn.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #last-updated { font-size: 0.85rem; color: #555; }
    #status-msg { font-size: 0.82rem; color: #c0392b; }
    #status-msg.ok { color: #1e8a4a; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin: 20px 0 0;
      border-bottom: 2px solid #ccc;
    }
    .tab-btn {
      padding: 9px 22px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #666;
      cursor: pointer;
    }
    .tab-btn:hover { color: #1a56db; }
    .tab-btn.active {
      color: #1a56db;
      border-bottom-color: #1a56db;
    }
    .tab-panel { display: none; padding-top: 20px; }
    /* Non-wrapping headers give the table a minimum width; on a narrow window
       scroll the panel rather than the whole page. */
    .tab-panel.active { display: block; overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      /* Fixed layout so column widths come from the colgroup below rather than
         from each tab's own content - otherwise the LTC tab (names up to 56
         chars) and the EOS tabs (24) lay out differently and the table jumps
         when you switch tabs. */
      table-layout: fixed;
      /* Below this the non-wrapping headers no longer fit; the panel scrolls
         horizontally instead of the headers overflowing their cells. */
      min-width: 1060px;
    }
    col.c-name  { width: 30.5%; }
    col.c-tcg   { width: 11%; }
    col.c-mp    { width: 10.5%; }
    col.c-trend { width: 17%; }
    col.c-nf    { width: 17%; }
    col.c-foil  { width: 14%; }
    thead th {
      background: #f0f0f0;
      text-align: left;
      padding: 10px 14px;
      font-weight: 600;
      border-bottom: 2px solid #ccc;
      /* Keep every header on one line. The LTC/LTR tabs carry both the LOTR
         and MTG name, so their Name column is wide enough to squeeze the
         later headers into wrapping, which made the header bar taller on
         some tabs than others. */
      white-space: nowrap;
    }
    thead th.col-check { text-align: center; }
    tbody tr:nth-child(even) { background: #fafafa; }
    tbody tr:hover { background: #f0f4ff; }
    td { padding: 9px 14px; border-bottom: 1px solid #e8e8e8; }
    td:first-child { font-weight: 500; }
    td.col-price, td.col-trend { white-space: nowrap; }
    td.col-check { text-align: center; }
    a { color: #1a56db; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .na { color: #aaa; font-style: italic; font-weight: 400; }

    .owned-check { color: #1a8a4a; font-size: 1.1rem; }

    /* Sortable headers */
    thead th.sortable { cursor: pointer; user-select: none; position: relative; }
    thead th.sortable:hover { background: #e8e8e8; }
    thead th .sort-ind { display: inline-block; width: 12px; margin-left: 4px; color: #999; font-size: 0.75em; }
    thead th.sort-active .sort-ind { color: #1a56db; }

    /* Card name click affordance */
    td .card-link {
      color: #1a1a1a;
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px dotted #b0b0b0;
    }
    td .card-link:hover { color: #1a56db; border-bottom-color: #1a56db; }

    /* Card image modal */
    #card-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #card-modal.open { display: flex; }
    /* When opened by hover the overlay must not swallow the cursor, or the
       mouseout that should dismiss it never reaches the card name underneath. */
    #card-modal.hover-preview { pointer-events: none; }
    #card-modal .modal-inner {
      background: transparent;
      max-width: 90vw;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #card-modal img {
      max-width: min(400px, 88vw);
      max-height: 82vh;
      border-radius: 4.75%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: #222;
    }
    #card-modal .modal-caption {
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
      max-width: 400px;
    }
    #card-modal .modal-close {
      position: absolute;
      top: 18px;
      right: 22px;
      color: #fff;
      background: none;
      border: none;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    td.col-price a { color: #1a1a1a; }
    .best-price { color: #128a3f !important; font-weight: 800 !important; }
    .best-price::after { content: ' \2193'; font-size: 0.85em; }

    /* 30-day trend: sparkline + 7-day delta.
       Single series, so one recessive hue and no legend - the column header
       names it. The delta arrow carries direction so it never reads by
       colour alone. */
    .trend { display: inline-flex; align-items: center; gap: 9px; }
    .spark { display: block; flex: none; }
    .spark-line { fill: none; stroke: #98a2b3; stroke-width: 2;
                  stroke-linecap: round; stroke-linejoin: round; }
    .spark-dot { fill: #1a56db; }
    .delta {
      font-size: 0.82rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      min-width: 58px;
    }
    .delta.up   { color: #128a3f; }
    .delta.down { color: #c0392b; }
    .delta.flat { color: #777; }
    .delta.na   { color: #bbb; font-weight: 400; }

    .summary {
      display: flex;
      gap: 14px;
      margin: 4px 0 18px;
      flex-wrap: wrap;
    }
    .summary-card {
      flex: 1 1 220px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      background: #fafafa;
    }
    .summary-card.owned { border-color: #b8dcc4; background: #f0faf3; }
    .summary-card.missing { border-color: #f0d0c0; background: #fdf6f2; }
    .summary-label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .summary-value { font-size: 1.4rem; font-weight: 700; }
    .summary-card.owned .summary-value { color: #128a3f; }
    .summary-card.missing .summary-value { color: #b0552a; }
    .summary-sub { font-size: 0.78rem; color: #777; margin-top: 2px; }

    /* Sort control for the stacked layout below; the table header does the
       job everywhere else, so this is hidden until the media query wants it. */
    .mobile-sort {
      display: none;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 0.82rem;
      color: #666;
    }
    .mobile-sort select {
      flex: 1 1 auto;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      font-size: 0.9rem;
      color: #1a1a1a;
    }

    .hint-tap { display: none; }

    /* ---- Narrow viewports ------------------------------------------------
       Scoped entirely to this block: the desktop layout above is untouched.
       The table keeps its markup and is re-laid out as one card per row, so
       nothing scrolls sideways and there is no second row-building path in
       JS to drift out of step with the first. */
    @media (max-width: 700px) {
      body { margin: 16px auto; padding: 0 12px; }
      h1 { font-size: 1.15rem; }
      p.meta { font-size: 0.8rem; }
      .hint-hover { display: none; }
      .hint-tap { display: block; }

      /* A swipeable strip. Without this the seven tabs are wider than the
         viewport and the whole page scrolls sideways with them. */
      .tabs {
        flex-wrap: nowrap;
        overflow-x: auto;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab-btn {
        flex: none;
        white-space: nowrap;
        padding: 11px 14px;
        font-size: 0.86rem;
        scroll-snap-align: start;
      }

      .tab-panel.active { padding-top: 14px; }
      .summary { gap: 10px; margin-bottom: 14px; }
      .summary-card { padding: 10px 14px; }
      .summary-value { font-size: 1.25rem; }

      .mobile-sort { display: flex; }

      table { display: block; min-width: 0; table-layout: auto; }
      colgroup, thead { display: none; }
      tbody { display: block; }

      tbody tr, tbody tr:nth-child(even), tbody tr:hover { background: #fff; }
      tbody tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        /* The name gets the full width: sharing its row with the collected
           pills wrapped almost every card onto a second line. */
        grid-template-areas:
          "name name  name"
          "tcg  trend trend"
          "mp   nf    foil";
        align-items: center;
        gap: 2px 8px;
        border: 1px solid #e4e4e4;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      td { padding: 0; border-bottom: none; }
      td:first-child {
        grid-area: name;
        font-weight: 600;
        font-size: 0.97rem;
        margin-bottom: 5px;
      }
      /* The dotted underline reads as a defect at this size; the link colour
         carries the affordance instead. */
      td .card-link { border-bottom: none; color: #1a56db; }

      td.col-price { font-variant-numeric: tabular-nums; }
      td.col-price:nth-child(2) { grid-area: tcg; }
      td.col-price:nth-child(3) { grid-area: mp; }
      td.col-price::before {
        content: attr(data-label);
        display: inline-block;
        min-width: 32px;
        color: #8a8a8a;
        font-size: 0.76rem;
        font-weight: 700;
      }

      td.col-trend { grid-area: trend; justify-self: end; }
      .delta { min-width: 52px; text-align: right; }

      /* Collected state reads as a pill. An uncollected cell is genuinely
         empty, so :empty tells the two apart without changing the markup. */
      td.col-check {
        text-align: center;
        align-self: start;
        border: 1px solid #b8dcc4;
        background: #f0faf3;
        color: #128a3f;
        border-radius: 999px;
        padding: 3px 8px;
        white-space: nowrap;
      }
      td.col-check:nth-child(5) { grid-area: nf; }
      td.col-check:nth-child(6) { grid-area: foil; }
      td.col-check::before {
        content: attr(data-label);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      td.col-check:empty { border-color: #e6e6e6; background: #fafafa; color: #bbb; }
      .owned-check { font-size: 0.8rem; margin-left: 3px; }

      #card-modal .modal-close { top: 4px; right: 6px; font-size: 2.2rem; padding: 6px 12px; }
    }

  </style>
</head>
<body>

<h1>Magic the Gathering — Collection Price Tracker</h1>
<!-- Two whole paragraphs rather than one with a swapped tail: wrapping part of
     the desktop line in a span re-shapes the text run and moves a few glyphs
     by a subpixel. Only one of these is ever displayed. -->
<p class="meta hint-hover">Condition: Near Mint &nbsp;·&nbsp; Finish: Non-Foil &nbsp;·&nbsp; Click any column header to sort · Hover a card name to preview the art</p>
<p class="meta hint-tap">Condition: Near Mint &nbsp;·&nbsp; Finish: Non-Foil &nbsp;·&nbsp; Tap a card name to see the art</p>

<div class="toolbar">
  <button id="refresh-btn" disabled title="Prices are refreshed automatically once per day.">
    <span class="spinner"></span>
    Scheduled Daily Refresh
  </button>
  <span id="last-updated">Loading...</span>
</div>

<!-- Tabs and panels are built from the "tabs" block in prices.json, so
     adding a set needs no change here. -->
<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<div id="card-modal" onclick="closeModal(event)">
  <button class="modal-close" onclick="closeModal(event, true)" aria-label="Close">&times;</button>
  <div class="modal-inner" onclick="event.stopPropagation()">
    <img id="modal-img" src="" alt="">
    <div class="modal-caption" id="modal-caption"></div>
  </div>
</div>

<script>
const OWNER    = 'AlexPope';
const REPO     = 'mtg-price-tracker';
const WORKFLOW = 'update-prices.yml';

function fmt(price) {
  if (price == null) return '<span class="na">N/A</span>';
  return '$' + price.toFixed(2);
}

const CHECK = '<span class="owned-check" title="Collected">&#10003;</span>';

// Tabs come from prices.json; a tab's key is also its key into the data and
// the suffix of its DOM ids.
let TABS = [];
const tabKeys = () => TABS.map(t => t.key);

// Older prices.json files predate the "tabs" block. Fall back to whatever
// sections are present so the page still renders something useful.
function deriveTabs(data) {
  if (Array.isArray(data.tabs) && data.tabs.length) return data.tabs;
  return Object.keys(data)
    .filter(k => Array.isArray(data[k]))
    .map(k => ({ key: k, label: k.replace(/_/g, ' '), subtitle: '' }));
}

// Card identity that survives re-sorting and schema changes; mirrors
// CARD_KEY_RE in scripts/build_history.py.
const CARD_KEY_RE = /\/card\/([^/]+)\/([^/?]+)/;
function cardKey(c) {
  const m = CARD_KEY_RE.exec(c.mp_url || '');
  return m ? `${m[1]}/${m[2]}` : null;
}

const TREND_DAYS = 7;   // window for the delta
const SPARK_DAYS = 30;  // window for the sparkline

const state = {
  data: null,
  history: null,
  sort: {},   // keyed by tab, populated once the tabs are known
};

const COLUMNS = [
  { col: 'name',  label: 'Card Name' },
  { col: 'tcg',   label: 'TCGPlayer' },
  { col: 'mp',    label: 'ManaPool' },
  { col: 'trend', label: '30-Day Trend (TCG)',
    title: 'TCGplayer price: 30-day sparkline, with the change over the last 7 days' },
  { col: 'nf',    label: 'Collected Non-Foil', cls: 'col-check' },
  { col: 'foil',  label: 'Collected Foil',     cls: 'col-check' },
];

// The stacked mobile layout hides the header row, so sorting needs its own
// control there. Each option is a column and direction the headers can also
// reach, so the two never disagree about what is possible.
const SORT_OPTIONS = [
  { val: 'tcg:asc',   label: 'Price — low to high' },
  { val: 'tcg:desc',  label: 'Price — high to low' },
  { val: 'trend:desc',label: 'Biggest 7-day gain' },
  { val: 'trend:asc', label: 'Biggest 7-day drop' },
  { val: 'name:asc',  label: 'Card name — A to Z' },
  { val: 'nf:desc',   label: 'Collected first' },
  { val: 'nf:asc',    label: 'Missing first' },
];

// Builds the tab bar and one panel per tab. Everything below this point works
// off the generated DOM, so a new set arrives with no markup change.
function buildScaffold(tabs) {
  const head = COLUMNS.map(c =>
    `<th class="sortable${c.cls ? ' ' + c.cls : ''}" data-col="${c.col}"`
    + `${c.title ? ` title="${escapeHTML(c.title)}"` : ''}>`
    + `${escapeHTML(c.label)}<span class="sort-ind"></span></th>`).join('');

  document.getElementById('tabs').innerHTML = tabs.map((t, i) =>
    `<button class="tab-btn${i === 0 ? ' active' : ''}" data-tab="${escapeHTML(t.key)}">`
    + `${escapeHTML(t.label)}</button>`).join('');

  document.getElementById('panels').innerHTML = tabs.map((t, i) => `
    <div id="tab-${escapeHTML(t.key)}" class="tab-panel${i === 0 ? ' active' : ''}">
      ${t.subtitle ? `<p class="meta" style="margin-bottom:12px">${escapeHTML(t.subtitle)}</p>` : ''}
      <div class="summary" id="summary-${escapeHTML(t.key)}"></div>
      <label class="mobile-sort" for="sort-${escapeHTML(t.key)}">Sort
        <select id="sort-${escapeHTML(t.key)}" data-tab="${escapeHTML(t.key)}">
          ${SORT_OPTIONS.map(o =>
            `<option value="${o.val}">${escapeHTML(o.label)}</option>`).join('')}
        </select>
      </label>
      <table>
        <colgroup>
          <col class="c-name"><col class="c-tcg"><col class="c-mp">
          <col class="c-trend"><col class="c-nf"><col class="c-foil">
        </colgroup>
        <thead><tr>${head}</tr></thead>
        <tbody id="tbody-${escapeHTML(t.key)}">
          <tr><td colspan="${COLUMNS.length}" style="color:#999;padding:20px 14px">Loading…</td></tr>
        </tbody>
      </table>
    </div>`).join('');

  state.sort = {};
  for (const t of tabs) state.sort[t.key] = { col: 'tcg', dir: 'asc' };
}

function bestPrice(c) {
  if (c.tcg_price == null && c.mp_price == null) return null;
  if (c.tcg_price == null) return c.mp_price;
  if (c.mp_price == null) return c.tcg_price;
  return Math.min(c.tcg_price, c.mp_price);
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Returns the TCG series for a card over the last `days`, plus the matching
// dates. TCGplayer is the primary series: it is the more complete of the two
// and the less scrape-fragile. ManaPool is used only if TCG has nothing at
// all, so `source` is carried through to keep the tooltips honest if it does.
function trendSeries(card) {
  if (!state.history) return null;
  const entry = state.history.cards[cardKey(card)];
  if (!entry) return null;
  const dates = state.history.dates;
  const useTcg = entry.tcg.some(v => v != null);
  const from = Math.max(0, dates.length - SPARK_DAYS);
  return {
    values: (useTcg ? entry.tcg : entry.mp).slice(from),
    dates: dates.slice(from),
    source: useTcg ? 'TCGplayer' : 'ManaPool',
  };
}

// Percentage change over `days`, measured from the most recent reading back to
// the latest reading at least that old. Returns null when the card has too
// little history to say anything honest.
function trendDelta(series, days) {
  if (!series) return null;
  const { values, dates } = series;
  let last = -1;
  for (let i = values.length - 1; i >= 0; i--) { if (values[i] != null) { last = i; break; } }
  if (last < 0) return null;

  const cutoff = new Date(dates[last] + 'T00:00:00Z');
  cutoff.setUTCDate(cutoff.getUTCDate() - days);
  let base = -1;
  for (let i = last - 1; i >= 0; i--) {
    if (values[i] == null) continue;
    if (new Date(dates[i] + 'T00:00:00Z') <= cutoff) { base = i; break; }
  }
  if (base < 0 || !values[base]) return null;
  return { pct: (values[last] - values[base]) / values[base] * 100,
           from: values[base], to: values[last] };
}

// Sparkline. Gaps are genuine breaks in the path rather than interpolated
// across, so a missing day never masquerades as a flat one.
function sparkline(series) {
  if (!series) return '';
  const { values, dates } = series;
  const present = values.filter(v => v != null);
  if (present.length < 2) return '';

  const W = 74, H = 20, PAD = 3;
  const min = Math.min(...present), max = Math.max(...present);
  const span = (max - min) || 1;
  const x = i => PAD + (values.length === 1 ? 0 : (i / (values.length - 1)) * (W - 2 * PAD));
  const y = v => H - PAD - ((v - min) / span) * (H - 2 * PAD);

  // Group into runs of consecutive readings, then draw each run as its own
  // subpath. A run of one becomes a zero-length segment, which the round
  // linecap renders as a dot - otherwise an isolated reading would vanish.
  const runs = [];
  values.forEach((v, i) => {
    if (v == null) { runs.push(null); return; }
    const tail = runs[runs.length - 1];
    if (Array.isArray(tail)) tail.push(i); else runs.push([i]);
  });

  let d = '', lastIdx = -1;
  for (const run of runs) {
    if (!Array.isArray(run)) continue;
    const pt = i => `${x(i).toFixed(1)},${y(values[i]).toFixed(1)}`;
    d += 'M' + pt(run[0]);
    d += run.length === 1 ? 'L' + pt(run[0])
                          : run.slice(1).map(i => 'L' + pt(i)).join('');
    lastIdx = run[run.length - 1];
  }

  const label = `${series.source} · ${dates[0]} to ${dates[dates.length - 1]}: `
              + `low ${money(min)}, high ${money(max)}`;
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" `
       + `role="img" aria-label="${escapeHTML(label)}">`
       + `<title>${escapeHTML(label)}</title>`
       + `<path class="spark-line" d="${d}"/>`
       + `<circle class="spark-dot" cx="${x(lastIdx).toFixed(1)}" cy="${y(values[lastIdx]).toFixed(1)}" r="2.2"/>`
       + `</svg>`;
}

function deltaCell(delta, source) {
  if (!delta) return '<span class="delta na" title="Not enough price history yet">—</span>';
  const rounded = Math.round(delta.pct * 10) / 10;
  const tip = `${source} · 7 days: ${money(delta.from)} → ${money(delta.to)}`;
  if (rounded === 0) {
    return `<span class="delta flat" title="${escapeHTML(tip)}">0.0%</span>`;
  }
  const up = rounded > 0;
  const cls = up ? 'up' : 'down';
  const arrow = up ? '▲' : '▼';
  return `<span class="delta ${cls}" title="${escapeHTML(tip)}">`
       + `${arrow} ${up ? '+' : ''}${rounded.toFixed(1)}%</span>`;
}

function buildRows(cards, tabName) {
  return cards.map(c => {
    const tcg = c.tcg_price, mp = c.mp_price;
    const tcgBest = tcg != null && mp != null && tcg < mp;
    const mpBest  = tcg != null && mp != null && mp < tcg;
    const tcgCls = tcgBest ? ' class="best-price"' : '';
    const mpCls  = mpBest  ? 'best-price' : '';
    const nameCell = c.image_url
      ? `<span class="card-link" data-tab="${tabName}" data-idx="${c._idx}">${escapeHTML(c.display_name)}</span>`
      : escapeHTML(c.display_name);

    const series = trendSeries(c);
    const trend = `<span class="trend">${sparkline(series)}`
                + `${deltaCell(trendDelta(series, TREND_DAYS), series && series.source)}</span>`;

    // data-label feeds the stacked mobile layout, where there is no header
    // row to read the column off. Inert on desktop.
    return `<tr>
      <td>${nameCell}</td>
      <td class="col-price" data-label="TCG"><a href="${c.tcg_url}" target="_blank"${tcgCls}>${fmt(tcg)}</a></td>
      <td class="col-price" data-label="MP">${mp != null
        ? `<a href="${c.mp_url}" target="_blank" class="${mpCls}">${fmt(mp)}</a>`
        : `<a href="${c.mp_url}" target="_blank" class="na">N/A</a>`}</td>
      <td class="col-trend">${trend}</td>
      <td class="col-check" data-label="NF">${c.collected_nonfoil ? CHECK : ''}</td>
      <td class="col-check" data-label="Foil">${c.collected_foil ? CHECK : ''}</td>
    </tr>`;
  }).join('');
}

// Sort keys per column. Returns [primary, secondary] — secondary is tcg_price as tiebreaker.
function sortKey(col, c) {
  switch (col) {
    case 'name': return c.display_name.toLowerCase();
    case 'tcg':  return c.tcg_price == null ? Infinity : c.tcg_price;
    case 'mp':   return c.mp_price  == null ? Infinity : c.mp_price;
    case 'nf':   return c.collected_nonfoil ? 1 : 0;
    case 'foil': return c.collected_foil    ? 1 : 0;
    // Cards without enough history sort to the bottom of the default (biggest
    // movers first) view rather than pretending to be flat at 0%.
    case 'trend': {
      const d = trendDelta(trendSeries(c), TREND_DAYS);
      return d ? d.pct : -Infinity;
    }
  }
}
function sortCards(cards, col, dir) {
  const sign = dir === 'asc' ? 1 : -1;
  return [...cards].sort((a, b) => {
    const va = sortKey(col, a), vb = sortKey(col, b);
    if (va < vb) return -1 * sign;
    if (va > vb) return  1 * sign;
    // tiebreaker: TCG price ascending
    const ta = a.tcg_price == null ? Infinity : a.tcg_price;
    const tb = b.tcg_price == null ? Infinity : b.tcg_price;
    return ta - tb;
  });
}

function updateHeaderIndicators(tabName) {
  const {col, dir} = state.sort[tabName];
  const arrow = dir === 'asc' ? '▲' : '▼';
  const panel = document.getElementById('tab-' + tabName);
  panel.querySelectorAll('thead th.sortable').forEach(th => {
    const isActive = th.dataset.col === col;
    th.classList.toggle('sort-active', isActive);
    th.querySelector('.sort-ind').textContent = isActive ? arrow : '';
  });
}

function money(n) {
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function buildSummary(cards) {
  let ownedVal = 0, ownedCount = 0, missCost = 0, missCount = 0, totalCards = cards.length;
  for (const c of cards) {
    const bp = bestPrice(c);
    const isOwned = c.collected_nonfoil || c.collected_foil;
    if (isOwned) {
      ownedCount++;
      if (bp != null) ownedVal += bp;
    } else {
      missCount++;
      if (bp != null) missCost += bp;
    }
  }
  return `
    <div class="summary-card owned">
      <div class="summary-label">Current Collection Value</div>
      <div class="summary-value">${money(ownedVal)}</div>
      <div class="summary-sub">${ownedCount} / ${totalCards} cards collected</div>
    </div>
    <div class="summary-card missing">
      <div class="summary-label">Cost to Complete</div>
      <div class="summary-value">${money(missCost)}</div>
      <div class="summary-sub">${missCount} card${missCount === 1 ? '' : 's'} missing</div>
    </div>`;
}

function renderTab(tabName) {
  const cards = state.data[tabName];
  const {col, dir} = state.sort[tabName];
  const sorted = sortCards(cards, col, dir);
  document.getElementById('tbody-' + tabName).innerHTML = buildRows(sorted, tabName);
  document.getElementById('summary-' + tabName).innerHTML = buildSummary(cards);
  updateHeaderIndicators(tabName);
  syncSortSelect(tabName);
}

// Keeps the mobile control honest when the sort was set by a header click —
// a column the select cannot express (ManaPool, Foil) clears it rather than
// leaving a stale option looking selected.
function syncSortSelect(tabName) {
  const sel = document.getElementById('sort-' + tabName);
  if (!sel) return;
  const {col, dir} = state.sort[tabName];
  const val = `${col}:${dir}`;
  sel.selectedIndex = SORT_OPTIONS.findIndex(o => o.val === val);
}

function handleSortClick(tabName, col) {
  const s = state.sort[tabName];
  if (s.col === col) {
    s.dir = s.dir === 'asc' ? 'desc' : 'asc';
  } else {
    s.col = col;
    // Sensible default direction per column
    s.dir = (col === 'nf' || col === 'foil' || col === 'trend') ? 'desc' : 'asc';
  }
  renderTab(tabName);
}

function wireSortHeaders() {
  document.querySelectorAll('thead th.sortable').forEach(th => {
    const panel = th.closest('.tab-panel');
    const tabName = panel.id.replace('tab-', '');
    th.addEventListener('click', () => handleSortClick(tabName, th.dataset.col));
  });
}

function showCard(tabName, idx, viaHover) {
  const card = (state.data[tabName] || []).find(c => c._idx === idx);
  if (!card || !card.image_url) return;
  document.getElementById('modal-img').src = card.image_url;
  document.getElementById('modal-img').alt = card.display_name;
  document.getElementById('modal-caption').textContent = card.display_name;
  const modal = document.getElementById('card-modal');
  modal.classList.add('open');
  // A hover preview is transient and click-through; a clicked one is interactive.
  modal.classList.toggle('hover-preview', !!viaHover);
}

function closeModal(e, force) {
  if (!force && e && e.target.closest('.modal-inner')) return;
  document.getElementById('card-modal').classList.remove('open');
}

// History is optional: if it is missing or malformed the tables still render,
// with the trend column showing that there is nothing to plot yet.
async function loadHistory() {
  try {
    const r = await fetch('history.json?_=' + Date.now());
    if (!r.ok) return null;
    const h = await r.json();
    return (h && Array.isArray(h.dates) && h.cards) ? h : null;
  } catch (e) {
    return null;
  }
}

async function loadPrices() {
  try {
    const [r, history] = await Promise.all([
      fetch('prices.json?_=' + Date.now()),
      loadHistory(),
    ]);
    state.history = history;
    const data = await r.json();

    TABS = deriveTabs(data);
    buildScaffold(TABS);
    wireSortHeaders();

    // Assign stable indexes so sort/render can reference by _idx. A tab whose
    // section is missing renders as empty rather than throwing.
    for (const key of tabKeys()) {
      if (Array.isArray(data[key])) data[key].forEach((c, i) => c._idx = i);
      else data[key] = [];
    }
    state.data = data;

    tabKeys().forEach(renderTab);

    const ts = new Date(data.updated_at);
    document.getElementById('last-updated').textContent =
      'Last updated: ' + ts.toLocaleString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
      });
  } catch (e) {
    document.getElementById('last-updated').textContent = 'Could not load prices.json';
  }
}

// Matches on the button's own data-tab rather than its position, so the tab
// bar and the panels can never drift out of step.
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  for (const key of tabKeys()) {
    document.getElementById('tab-' + key).classList.toggle('active', key === name);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  loadPrices();   // builds the scaffold, then wires the sort headers

  // Tab buttons are generated, so listen on the bar rather than each button.
  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (btn) switchTab(btn.dataset.tab);
  });

  // Same for the per-tab sort selects.
  document.getElementById('panels').addEventListener('change', (e) => {
    const sel = e.target.closest('.mobile-sort select');
    if (!sel) return;
    const [col, dir] = sel.value.split(':');
    state.sort[sel.dataset.tab] = { col, dir };
    renderTab(sel.dataset.tab);
  });

  // Card image preview via event delegation
  let hoverTimer = null;
  const previewCard = (e) => {
    const link = e.target.closest('.card-link');
    if (!link) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => {
      showCard(link.dataset.tab, Number(link.dataset.idx), true);
    }, 750);
  };

  document.addEventListener('click', (e) => {
    const link = e.target.closest('.card-link');
    if (link) showCard(link.dataset.tab, Number(link.dataset.idx), false);
  });

  // Hover preview only where there is a real hovering pointer. A tap emits a
  // synthetic mouseover as well as a click, so on touch the timer would
  // re-open the just-clicked modal as a hover preview — which is
  // pointer-events:none, and mouseout never arrives to dismiss it. The result
  // is a modal that swallows nothing and cannot be closed.
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    document.addEventListener('mouseover', previewCard);

    document.addEventListener('mouseout', (e) => {
      const link = e.target.closest('.card-link');
      if (!link) return;
      clearTimeout(hoverTimer);
      // Only auto-dismiss a hover preview — a clicked one stays until dismissed.
      const modal = document.getElementById('card-modal');
      if (!modal.classList.contains('hover-preview')) return;
      const related = e.relatedTarget;
      if (!related || !link.contains(related)) closeModal(null, true);
    });
  }

  // ESC closes modal
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal(null, true);
  });
});
</script>

</body>
