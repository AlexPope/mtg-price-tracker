<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Collection Price Tracker</title>
  <script>
    // Inline and before the stylesheet on purpose: resolving the theme after
    // first paint flashes the light page at anyone who wants the dark one.
    // An explicit choice is remembered; without one the OS setting decides,
    // and keeps deciding (see the change listener at the bottom of the page).
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
      var dark = stored ? stored === 'dark'
                        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
  <style>
    /* Reserve the scrollbar gutter on every tab. The short tabs (Book Cover's
       10 cards) fit without a vertical scrollbar, and losing it widened the
       viewport by the scrollbar's width - which the centred body turned into
       a sideways jog of half that on every tab switch. Mobile browsers use
       overlay scrollbars, where the gutter is zero, so this is a no-op there. */
    html { scrollbar-gutter: stable; }

    /* Every colour on the page comes from here, so the dark palette below is
       the only place that has to know the light one exists. The `dark` class
       is set on <html> by the inline script in <head> before first paint. */
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --faint: #999999;
      --fainter: #bbbbbb;
      --line: #e8e8e8;
      --line-strong: #cccccc;
      --accent: #1a56db;
      --btn-fg: #ffffff;
      /* The header band has to separate from both the page and the zebra
         rows, so it sits a clear step below --row-alt rather than beside it,
         and carries its own border token: at --line-strong the rule under it
         read as just another row divider. */
      --th-bg: #d5dfec;
      --th-bg-hover: #c7d3e5;
      --th-border: #93a0b3;
      --row-alt: #fafafa;
      /* A tint rather than a fill: the chips below are solid accent, and the
         tab that contains them must not compete with its own contents. The
         label darkens along with the ground, or it drops below AA on it. */
      --tab-active-bg: #bed3f7;
      --tab-active-fg: #1043ae;
      --row-hover: #f0f4ff;
      --pos: #128a3f;
      --neg: #c0392b;
      --warn: #b0552a;
      --spark: #98a2b3;
      --card-bg: #fafafa;
      --card-border: #e0e0e0;
      --owned-bg: #f0faf3;
      --owned-border: #b8dcc4;
      --missing-bg: #fdf6f2;
      --missing-border: #f0d0c0;
      --input-bg: #ffffff;
    }
    /* Not a straight inversion: the greens and blues are lightened as well as
       the greys, or they fail contrast against a dark ground. */
    :root.dark {
      color-scheme: dark;
      --bg: #14161a;
      --fg: #e6e8ec;
      --muted: #9aa3ae;
      --faint: #79828d;
      --fainter: #5c646e;
      --line: #2a2f37;
      --line-strong: #3a414b;
      --accent: #7aa2f7;
      /* The accent is a light blue here, so anything filled with it wants
         dark text - the chips and the collected toggle both rely on this. */
      --btn-fg: #0f1116;
      /* Lifted well clear of #14161a. The old #21252c was only a few points
         of luminance off the page behind it, which is why the header row was
         hard to pick out at a glance. */
      --th-bg: #2c333d;
      --th-bg-hover: #363e4a;
      --th-border: #525c6b;
      --row-alt: #191c21;
      /* Same relationship inverted: the ground lightens, so the label does too. */
      --tab-active-bg: #2e4169;
      --tab-active-fg: #a9c4fb;
      --row-hover: #202834;
      --pos: #4ade80;
      --neg: #f87171;
      --warn: #e8a06a;
      --spark: #7d8794;
      --card-bg: #1b1e24;
      --card-border: #2f353e;
      /* Brighter than a proportional darkening of the light borders would
         give: at that weight they disappeared into the page behind them. */
      --owned-bg: #16241c;
      --owned-border: #55a87a;
      --missing-bg: #241a13;
      --missing-border: #b07a4a;
      --input-bg: #1b1e24;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      /* Widened from 920px when the trend column made it six columns: fixed
         widths plus non-wrapping headers need the extra room. */
      max-width: 1140px;
      margin: 40px auto;
      padding: 0 20px;
      color: var(--fg);
      background: var(--bg);
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.meta { font-size: 0.85rem; color: var(--muted); margin-top: 0; margin-bottom: 0; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 16px 0 0;
      flex-wrap: wrap;
    }
    #last-updated { font-size: 0.85rem; color: var(--muted); }
    /* The refresh cadence, in the same line as the timestamp it explains. */
    #last-updated .schedule { color: var(--faint); }

    /* Pushed to the far end of the toolbar; it is a page-level setting, not
       part of the refresh/updated pair it would otherwise sit inside. */
    #theme-btn {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: none;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    #theme-btn:hover { color: var(--accent); border-color: var(--accent); }
    #theme-btn .theme-icon { font-size: 0.95rem; line-height: 1; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin: 20px 0 0;
      border-bottom: 2px solid var(--line-strong);
    }
    .tab-btn {
      padding: 9px 22px;
      background: none;
      border: none;
      /* 3px against the bar's 2px, so the active indicator overlaps the rule
         instead of merging into it. */
      border-bottom: 3px solid transparent;
      border-radius: 6px 6px 0 0;
      margin-bottom: -2px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-btn:hover { color: var(--accent); background: var(--row-hover); }
    /* Three cues rather than one - tinted ground, thicker accent underline and
       heavier text. The underline alone was doing all the work, and at 2px in
       the dark palette that was not enough to say which set you were on. */
    .tab-btn.active {
      color: var(--tab-active-fg);
      border-bottom-color: var(--tab-active-fg);
      background: var(--tab-active-bg);
      font-weight: 700;
    }
    .tab-panel { display: none; padding-top: 20px; }
    /* Non-wrapping headers give the table a minimum width; on a narrow window
       scroll the panel rather than the whole page. */
    .tab-panel.active { display: block; overflow-x: auto; }

    /* ---- Subset chips -----------------------------------------------------
       The second level of the navigation: one chip per treatment within the
       set, plus an "All" that unions them. A chip is a scope, not a filter -
       it decides which cards the panel is about, so the summary follows it
       while the search box and the collected control do not. It sits between
       the two for that reason: the summary above is what the chip changes,
       the filter row below is what narrows whatever the chip selected. */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 22px;
    }
    .chip {
      padding: 5px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: none;
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:hover { color: var(--accent); border-color: var(--accent); }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--btn-fg);
    }
    .chip .chip-n {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      opacity: 0.75;
      margin-left: 5px;
    }
    /* A group with a single section has nothing to choose between; the row
       would be "All · <the only thing>". JS omits it rather than styling it. */

    /* Which treatment a row came from, shown only in the unioned "All" view -
       under a specific chip every row would carry the same badge. */
    .treatment {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 7px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      vertical-align: 1px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      /* Fixed layout so column widths come from the colgroup below rather than
         from each tab's own content - otherwise the LTC tab (names up to 56
         chars) and the EOS tabs (24) lay out differently and the table jumps
         when you switch tabs. */
      table-layout: fixed;
      /* Below this the non-wrapping headers no longer fit; the panel scrolls
         horizontally instead of the headers overflowing their cells. */
      min-width: 1060px;
    }
    col.c-name  { width: 26%; }
    col.c-num   { width: 6.5%; }
    col.c-tcg   { width: 10.5%; }
    col.c-mp    { width: 10%; }
    col.c-trend { width: 16%; }
    col.c-nf    { width: 16%; }
    col.c-foil  { width: 15%; }
    thead th {
      background: var(--th-bg);
      text-align: left;
      padding: 11px 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      border-bottom: 2px solid var(--th-border);
      /* Keep every header on one line. The LTC/LTR tabs carry both the LOTR
         and MTG name, so their Name column is wide enough to squeeze the
         later headers into wrapping, which made the header bar taller on
         some tabs than others. */
      white-space: nowrap;
    }
    thead th.col-check { text-align: center; }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: var(--row-hover); }
    td { padding: 9px 14px; border-bottom: 1px solid var(--line); }
    td:first-child { font-weight: 500; }
    td.col-price, td.col-trend { white-space: nowrap; }
    td.col-check { text-align: center; }
    td.col-num {
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .na { color: var(--faint); font-style: italic; font-weight: 400; }

    .owned-qty { color: var(--pos); font-weight: 700; font-variant-numeric: tabular-nums; }

    /* Sortable headers */
    thead th.sortable { cursor: pointer; user-select: none; position: relative; }
    thead th.sortable:hover { background: var(--th-bg-hover); }
    thead th .sort-ind { display: inline-block; width: 12px; margin-left: 4px; color: var(--faint); font-size: 0.75em; }
    thead th.sort-active .sort-ind { color: var(--accent); }

    /* Card name click affordance */
    td .card-link {
      color: var(--fg);
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px dotted var(--faint);
    }
    td .card-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

    /* Card image modal */
    #card-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #card-modal.open { display: flex; }
    /* When opened by hover the overlay must not swallow the cursor, or the
       mouseout that should dismiss it never reaches the card name underneath. */
    #card-modal.hover-preview { pointer-events: none; }
    #card-modal .modal-inner {
      background: transparent;
      max-width: 90vw;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #card-modal img {
      max-width: min(400px, 88vw);
      max-height: 82vh;
      border-radius: 4.75%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: #222;
    }
    #card-modal .modal-caption {
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
      max-width: 400px;
    }
    #card-modal .modal-close {
      position: absolute;
      top: 18px;
      right: 22px;
      color: #fff;
      background: none;
      border: none;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    td.col-price a { color: var(--fg); }
    .best-price { color: var(--pos) !important; font-weight: 800 !important; }
    .best-price::after { content: ' \2193'; font-size: 0.85em; }

    /* 30-day trend: sparkline + 7-day delta.
       Single series, so one recessive hue and no legend - the column header
       names it. The delta arrow carries direction so it never reads by
       colour alone. */
    .trend { display: inline-flex; align-items: center; gap: 9px; }
    .spark { display: block; flex: none; }
    .spark-line { fill: none; stroke: var(--spark); stroke-width: 2;
                  stroke-linecap: round; stroke-linejoin: round; }
    .spark-dot { fill: var(--accent); }
    .delta {
      font-size: 0.82rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      min-width: 58px;
    }
    .delta.up   { color: var(--pos); }
    .delta.down { color: var(--neg); }
    .delta.flat { color: var(--muted); }
    .delta.na   { color: var(--fainter); font-weight: 400; }

    .summary {
      display: flex;
      gap: 14px;
      /* Generous below, so the chip row reads as its own band rather than as
         something attached to the totals above it. */
      margin: 4px 0 26px;
      flex-wrap: wrap;
    }
    .summary-card {
      flex: 1 1 220px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
    }
    .summary-card.owned { border-color: var(--owned-border); background: var(--owned-bg); }
    .summary-card.missing { border-color: var(--missing-border); background: var(--missing-bg); }
    .summary-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .summary-value { font-size: 1.4rem; font-weight: 700; }
    .summary-card.owned .summary-value { color: var(--pos); }
    .summary-card.missing .summary-value { color: var(--warn); }
    /* The count rides along on the label line rather than taking a third row.
       It opts out of the label's uppercase and tracking: read as one run of
       small caps the parenthetical competed with the label it qualifies. */
    .summary-note {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      color: var(--faint);
    }

    /* ---- Filter row -------------------------------------------------------
       One row per tab, holding the name search, the collected/missing
       segmented control and the "showing N of M" readout. Each tab keeps its
       own filter state, so switching tabs does not clear what you typed. */
    .filters {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      flex-wrap: wrap;
    }
    .filter-q {
      flex: 0 1 260px;
      min-width: 0;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--fg);
      font-size: 0.88rem;
      font-family: inherit;
    }
    .filter-q:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
    .filter-q::placeholder { color: var(--faint); }

    .own-toggle {
      display: flex;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      overflow: hidden;
    }
    .own-toggle button {
      padding: 8px 14px;
      background: none;
      border: none;
      border-left: 1px solid var(--line-strong);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .own-toggle button:first-child { border-left: none; }
    .own-toggle button:hover { color: var(--accent); }
    .own-toggle button.active {
      background: var(--accent);
      color: var(--btn-fg);
    }
    .filter-count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .filter-count.filtered { color: var(--accent); font-weight: 600; }
    /* Overrides the zebra/grid rules that assume a row is a card. */
    tbody tr.empty-row, tbody tr.empty-row:hover { background: none; }
    tbody tr.empty-row td { color: var(--faint); padding: 22px 14px; font-style: italic; }

    /* Sort control for the stacked layout below; the table header does the
       job everywhere else, so this is hidden until the media query wants it. */
    .mobile-sort {
      display: none;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .mobile-sort select {
      flex: 1 1 auto;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--input-bg);
      font-size: 0.9rem;
      color: var(--fg);
      font-family: inherit;
    }

    .hint-tap { display: none; }

    /* ---- Narrow viewports ------------------------------------------------
       Scoped entirely to this block: the desktop layout above is untouched.
       The table keeps its markup and is re-laid out as one card per row, so
       nothing scrolls sideways and there is no second row-building path in
       JS to drift out of step with the first. */
    @media (max-width: 700px) {
      body { margin: 16px auto; padding: 0 12px; }
      h1 { font-size: 1.15rem; }
      p.meta { font-size: 0.8rem; }
      .hint-hover { display: none; }
      .hint-tap { display: block; }

      /* A swipeable strip. Without this the set tabs are wider than the
         viewport and the whole page scrolls sideways with them. */
      .tabs {
        flex-wrap: nowrap;
        overflow-x: auto;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab-btn {
        flex: none;
        white-space: nowrap;
        padding: 11px 14px;
        font-size: 0.86rem;
        scroll-snap-align: start;
      }

      /* Same treatment for the chips, which are the longer of the two rows
         once a set has four or five treatments. */
      .chips {
        flex-wrap: nowrap;
        overflow-x: auto;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
        margin-bottom: 18px;
      }
      .chips::-webkit-scrollbar { display: none; }
      .chip { flex: none; padding: 7px 13px; scroll-snap-align: start; }

      .tab-panel.active { padding-top: 14px; }
      .summary { gap: 10px; margin-bottom: 20px; }
      .summary-card { padding: 10px 14px; }
      .summary-value { font-size: 1.25rem; }

      .mobile-sort { display: flex; }

      /* Search on its own line, then the segmented control and the count
         sharing the next one. 16px on the input is the threshold below which
         iOS Safari zooms the page in on focus. */
      .filters { gap: 8px; margin-bottom: 10px; }
      .filter-q { flex: 1 1 100%; min-height: 40px; font-size: 16px; }
      .own-toggle { flex: 1 1 auto; }
      .own-toggle button { flex: 1; padding: 10px 8px; }
      .filter-count { flex: 0 0 auto; }

      table { display: block; min-width: 0; table-layout: auto; }
      colgroup, thead { display: none; }
      tbody { display: block; }

      tbody tr, tbody tr:nth-child(even), tbody tr:hover { background: var(--bg); }
      tbody tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        /* The name gets nearly the full width: sharing its row with the
           collected pills wrapped almost every card onto a second line. The
           collector number is narrow enough to ride along at the end of it. */
        grid-template-areas:
          "name name  num"
          "tcg  trend trend"
          "mp   nf    foil";
        align-items: center;
        gap: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      td { padding: 0; border-bottom: none; }

      /* The grid above turns every row into a card; the empty state is a
         message, so it opts back out of all of it. */
      tbody tr.empty-row { display: block; border: none; padding: 0; margin: 0; }
      /* Overrides the name-cell rules, which this td matches as a first child. */
      tbody tr.empty-row td { padding: 18px 2px; margin: 0; font-size: 0.9rem; }
      td.col-name {
        grid-area: name;
        font-weight: 600;
        font-size: 0.97rem;
        margin-bottom: 5px;
      }
      /* Right-aligned against the name, prefixed so a bare number is not
         mistaken for a price or a count. */
      td.col-num {
        grid-area: num;
        justify-self: end;
        align-self: start;
        font-size: 0.76rem;
        font-weight: 700;
      }
      td.col-num::before { content: '#'; }
      /* The dotted underline reads as a defect at this size; the link colour
         carries the affordance instead. */
      td .card-link { border-bottom: none; color: var(--accent); }
      .treatment { font-size: 0.65rem; margin-left: 6px; padding: 1px 6px; }

      td.col-price { font-variant-numeric: tabular-nums; }
      td.col-tcg { grid-area: tcg; }
      td.col-mp  { grid-area: mp; }
      td.col-price::before {
        content: attr(data-label);
        display: inline-block;
        min-width: 32px;
        color: var(--faint);
        font-size: 0.76rem;
        font-weight: 700;
      }

      td.col-trend { grid-area: trend; justify-self: end; }
      .delta { min-width: 52px; text-align: right; }

      /* Collected state reads as a pill. An uncollected cell is genuinely
         empty, so :empty tells the two apart without changing the markup. */
      td.col-check {
        text-align: center;
        align-self: start;
        border: 1px solid var(--owned-border);
        background: var(--owned-bg);
        color: var(--pos);
        border-radius: 999px;
        padding: 3px 8px;
        white-space: nowrap;
      }
      td.col-nf   { grid-area: nf; }
      td.col-foil { grid-area: foil; }
      td.col-check::before {
        content: attr(data-label);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      td.col-check:empty { border-color: var(--line); background: var(--row-alt); color: var(--fainter); }
      .owned-qty { font-size: 0.8rem; margin-left: 3px; }

      #card-modal .modal-close { top: 4px; right: 6px; font-size: 2.2rem; padding: 6px 12px; }
    }

  </style>
</head>
<body>

<h1>Magic the Gathering — Collection Price Tracker</h1>
<!-- Two whole paragraphs rather than one with a swapped tail: wrapping part of
     the desktop line in a span re-shapes the text run and moves a few glyphs
     by a subpixel. Only one of these is ever displayed. -->
<p class="meta hint-hover">Condition: Near Mint &nbsp;·&nbsp; Finish: Non-Foil &nbsp;·&nbsp; Click any column header to sort · Hover a card name to preview the art</p>
<p class="meta hint-tap">Condition: Near Mint &nbsp;·&nbsp; Finish: Non-Foil &nbsp;·&nbsp; Tap a card name to see the art</p>

<div class="toolbar">
  <span id="last-updated">Loading...</span>
  <button id="theme-btn" type="button" aria-pressed="false">
    <span class="theme-icon" aria-hidden="true">&#9789;</span>
    <span class="theme-label">Dark</span>
  </button>
</div>

<!-- Tabs and panels are built from the "tabs" block in prices.json, so
     adding a set needs no change here. -->
<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<div id="card-modal" onclick="closeModal(event)">
  <button class="modal-close" onclick="closeModal(event, true)" aria-label="Close">&times;</button>
  <div class="modal-inner" onclick="event.stopPropagation()">
    <img id="modal-img" src="" alt="">
    <div class="modal-caption" id="modal-caption"></div>
  </div>
</div>

<script>
// When update-prices.yml is scheduled. Mirrors `cron: '7 11 * * *'` in
// .github/workflows/update-prices.yml field for field - change one and change
// the other. Both fields are carried rather than just the hour, so moving the
// cron off the hour cannot leave the page quietly rounding to the wrong time.
const REFRESH_UTC_HOUR = 11;
const REFRESH_UTC_MINUTE = 7;

// The scheduled time in the reader's own timezone, so it agrees with the
// timestamp beside it and follows daylight saving without being edited: the
// cron is fixed in UTC, so the local time it lands on shifts twice a year.
function refreshSchedule() {
  const d = new Date();
  d.setUTCHours(REFRESH_UTC_HOUR, REFRESH_UTC_MINUTE, 0, 0);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function fmt(price) {
  if (price == null) return '<span class="na">N/A</span>';
  return '$' + price.toFixed(2);
}

// Ownership is a copy count. Older prices.json files stored it as a boolean,
// so coerce rather than print "true" if the page is served ahead of the data.
const copies = v => typeof v === 'number' ? v : (v ? 1 : 0);

// A card I own none of gets a genuinely empty cell, not a "0": the mobile
// layout tells collected from missing with :empty, and a zero in every missing
// row is noise on a page whose whole point is what is still missing.
function ownedCell(n) {
  return n ? `<span class="owned-qty" title="${n} in collection">${n}</span>` : '';
}

// The navigation is two levels, both built from prices.json. A GROUP is a
// primary tab - one Magic set - and its key is the suffix of the panel's DOM
// ids. A SECTION is one treatment within a group, reached by a chip; its key
// is also its key into the price data.
let GROUPS = [];
let SECTIONS = [];
const groupKeys = () => GROUPS.map(g => g.key);
const sectionsOf = g => SECTIONS.filter(s => s.group === g);
// Section key -> chip label, for the treatment badge on unioned rows.
let SECTION_LABEL = {};

// Older prices.json files predate one or both blocks, and the page is served
// independently of the data - a deploy can land before the next price run.
// Missing "groups" degrades to one group per section, which is exactly the
// flat tab bar this replaced; missing "tabs" falls back to the raw sections.
function deriveNav(data) {
  const sections = (Array.isArray(data.tabs) && data.tabs.length)
    ? data.tabs
    : Object.keys(data)
        .filter(k => Array.isArray(data[k]))
        .map(k => ({ key: k, label: k.replace(/_/g, ' ') }));

  if (Array.isArray(data.groups) && data.groups.length
      && sections.every(s => s.group)) {
    // Only keep groups something actually points at, so a stale group block
    // cannot render a tab that opens onto nothing.
    const used = new Set(sections.map(s => s.group));
    const groups = data.groups.filter(g => used.has(g.key));
    if (groups.length) return { groups, sections };
  }

  return {
    groups: sections.map(s => ({ key: s.key, label: s.label })),
    sections: sections.map(s => ({ ...s, group: s.key })),
  };
}

// Card identity that survives re-sorting and schema changes; mirrors
// CARD_KEY_RE in scripts/build_history.py.
const CARD_KEY_RE = /\/card\/([^/]+)\/([^/?]+)/;
function cardKey(c) {
  const m = CARD_KEY_RE.exec(c.mp_url || '');
  return m ? `${m[1]}/${m[2]}` : null;
}

// prices.json carries collector_number, but the page and the data deploy
// independently, so fall back to the key encoded in mp_url rather than render
// a blank column against a file written before the field existed.
function collectorNumber(c) {
  if (c.collector_number != null) return c.collector_number;
  const m = CARD_KEY_RE.exec(c.mp_url || '');
  return m ? m[2] : '';
}

const TREND_DAYS = 7;   // window for the delta
const SPARK_DAYS = 30;  // window for the sparkline

const state = {
  data: null,     // prices.json as fetched: one array per section key
  cards: {},      // per group: every section's cards concatenated, in chip order
  history: null,
  sort: {},       // keyed by group, populated once the groups are known
  filter: {},     // ditto: { q, own, subset } per group; subset '' means All
};

const COLUMNS = [
  { col: 'name',  label: 'Card Name' },
  { col: 'num',   label: '#', cls: 'col-num', title: 'Collector number' },
  { col: 'tcg',   label: 'TCGPlayer' },
  { col: 'mp',    label: 'ManaPool' },
  { col: 'trend', label: '30-Day Trend (TCG)',
    title: 'TCGplayer price: 30-day sparkline, with the change over the last 7 days' },
  { col: 'nf',    label: 'Collected Non-Foil', cls: 'col-check',
    title: 'Copies of the non-foil printing in my collection; blank means none' },
  { col: 'foil',  label: 'Collected Foil',     cls: 'col-check',
    title: 'Copies of the foil printing in my collection; blank means none' },
];

// A card counts as collected if either finish is, which is the same rule the
// summary cards use - so "Missing" here and "cards missing" there always agree.
const OWN_FILTERS = [
  { val: 'all',       label: 'All' },
  { val: 'missing',   label: 'Missing' },
  { val: 'collected', label: 'Collected' },
];

// The stacked mobile layout hides the header row, so sorting needs its own
// control there. Each option is a column and direction the headers can also
// reach, so the two never disagree about what is possible.
const SORT_OPTIONS = [
  { val: 'tcg:asc',   label: 'Price — low to high' },
  { val: 'tcg:desc',  label: 'Price — high to low' },
  { val: 'trend:desc',label: 'Biggest 7-day gain' },
  { val: 'trend:asc', label: 'Biggest 7-day drop' },
  { val: 'name:asc',  label: 'Card name — A to Z' },
  { val: 'num:asc',   label: 'Collector number' },
  { val: 'nf:desc',   label: 'Collected first' },
  { val: 'nf:asc',    label: 'Missing first' },
];

// Builds the set tab bar and one panel per set, each with its own chip row.
// Everything below this point works off the generated DOM, so a new set or a
// new treatment arrives with no markup change.
function buildScaffold(groups) {
  const head = COLUMNS.map(c =>
    `<th class="sortable${c.cls ? ' ' + c.cls : ''}" data-col="${c.col}"`
    + `${c.title ? ` title="${escapeHTML(c.title)}"` : ''}>`
    + `${escapeHTML(c.label)}<span class="sort-ind"></span></th>`).join('');

  document.getElementById('tabs').innerHTML = groups.map((g, i) =>
    `<button class="tab-btn${i === 0 ? ' active' : ''}" data-tab="${escapeHTML(g.key)}">`
    + `${escapeHTML(g.label)}</button>`).join('');

  document.getElementById('panels').innerHTML = groups.map((g, i) => {
    const subs = sectionsOf(g.key);
    // One treatment means there is nothing to choose between - the row would
    // read "All · <the only thing>" and both would do the same.
    const chips = subs.length > 1
      ? `<div class="chips" role="group" aria-label="Treatment"
              data-tab="${escapeHTML(g.key)}">
           <button type="button" class="chip active" data-sub="" aria-pressed="true">All</button>
           ${subs.map(s =>
             `<button type="button" class="chip" data-sub="${escapeHTML(s.key)}"`
             + ` aria-pressed="false">${escapeHTML(s.label)}`
             + `<span class="chip-n" id="chipn-${escapeHTML(s.key)}"></span></button>`).join('')}
         </div>`
      : '';

    return `
    <div id="tab-${escapeHTML(g.key)}" class="tab-panel${i === 0 ? ' active' : ''}">
      <div class="summary" id="summary-${escapeHTML(g.key)}"></div>
      ${chips}
      <div class="filters">
        <input type="search" class="filter-q" id="q-${escapeHTML(g.key)}"
               data-tab="${escapeHTML(g.key)}" autocomplete="off"
               placeholder="Filter by card name…" aria-label="Filter by card name">
        <div class="own-toggle" role="group" aria-label="Collected filter"
             data-tab="${escapeHTML(g.key)}">
          ${OWN_FILTERS.map((o, j) =>
            `<button type="button" data-own="${o.val}" aria-pressed="${j === 0}"`
            + `${j === 0 ? ' class="active"' : ''}>${escapeHTML(o.label)}</button>`).join('')}
        </div>
        <span class="filter-count" id="count-${escapeHTML(g.key)}" aria-live="polite"></span>
      </div>
      <label class="mobile-sort" for="sort-${escapeHTML(g.key)}">Sort
        <select id="sort-${escapeHTML(g.key)}" data-tab="${escapeHTML(g.key)}">
          ${SORT_OPTIONS.map(o =>
            `<option value="${o.val}">${escapeHTML(o.label)}</option>`).join('')}
        </select>
      </label>
      <table>
        <colgroup>
          <col class="c-name"><col class="c-num"><col class="c-tcg"><col class="c-mp">
          <col class="c-trend"><col class="c-nf"><col class="c-foil">
        </colgroup>
        <thead><tr>${head}</tr></thead>
        <tbody id="tbody-${escapeHTML(g.key)}">
          <tr class="empty-row"><td colspan="${COLUMNS.length}">Loading…</td></tr>
        </tbody>
      </table>
    </div>`;
  }).join('');

  state.sort = {};
  state.filter = {};
  for (const g of groups) {
    state.sort[g.key] = { col: 'tcg', dir: 'asc' };
    state.filter[g.key] = { q: '', own: 'all', subset: '' };
  }
}

// Every card in a group, in chip order, tagged with the section it came from
// and given an index that is unique within the group (the modal looks cards up
// by it). Sections within a group may overlap - nothing forbids two treatments
// claiming a collector number - so a card is listed once, under the first
// section that claims it. That is the same rule card_keys() applies to ranges
// inside a section, one level up.
function groupCards(groupKey) {
  const out = [];
  const seen = new Set();
  for (const s of sectionsOf(groupKey)) {
    for (const c of (state.data[s.key] || [])) {
      const k = cardKey(c) || `${s.key}:${out.length}`;
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...c, _section: s.key, _idx: out.length });
    }
  }
  return out;
}

// The cards the panel is currently about: the whole group under "All", one
// section under a chip. This is a scope rather than a filter, so the summary
// follows it while the search box and the collected control do not.
function scopeCards(groupKey) {
  const sub = state.filter[groupKey].subset;
  const cards = state.cards[groupKey] || [];
  return sub ? cards.filter(c => c._section === sub) : cards;
}

function bestPrice(c) {
  if (c.tcg_price == null && c.mp_price == null) return null;
  if (c.tcg_price == null) return c.mp_price;
  if (c.mp_price == null) return c.tcg_price;
  return Math.min(c.tcg_price, c.mp_price);
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Returns the TCG series for a card over the last `days`, plus the matching
// dates. TCGplayer is the primary series: it is the more complete of the two
// and the less scrape-fragile. ManaPool is used only if TCG has nothing at
// all, so `source` is carried through to keep the tooltips honest if it does.
function trendSeries(card) {
  if (!state.history) return null;
  const entry = state.history.cards[cardKey(card)];
  if (!entry) return null;
  const dates = state.history.dates;
  const useTcg = entry.tcg.some(v => v != null);
  const from = Math.max(0, dates.length - SPARK_DAYS);
  return {
    values: (useTcg ? entry.tcg : entry.mp).slice(from),
    dates: dates.slice(from),
    source: useTcg ? 'TCGplayer' : 'ManaPool',
  };
}

// Percentage change over `days`, measured from the most recent reading back to
// the latest reading at least that old. Returns null when the card has too
// little history to say anything honest.
function trendDelta(series, days) {
  if (!series) return null;
  const { values, dates } = series;
  let last = -1;
  for (let i = values.length - 1; i >= 0; i--) { if (values[i] != null) { last = i; break; } }
  if (last < 0) return null;

  const cutoff = new Date(dates[last] + 'T00:00:00Z');
  cutoff.setUTCDate(cutoff.getUTCDate() - days);
  let base = -1;
  for (let i = last - 1; i >= 0; i--) {
    if (values[i] == null) continue;
    if (new Date(dates[i] + 'T00:00:00Z') <= cutoff) { base = i; break; }
  }
  if (base < 0 || !values[base]) return null;
  return { pct: (values[last] - values[base]) / values[base] * 100,
           from: values[base], to: values[last] };
}

// Sparkline. Gaps are genuine breaks in the path rather than interpolated
// across, so a missing day never masquerades as a flat one.
function sparkline(series) {
  if (!series) return '';
  const { values, dates } = series;
  const present = values.filter(v => v != null);
  if (present.length < 2) return '';

  const W = 74, H = 20, PAD = 3;
  const min = Math.min(...present), max = Math.max(...present);
  const span = (max - min) || 1;
  const x = i => PAD + (values.length === 1 ? 0 : (i / (values.length - 1)) * (W - 2 * PAD));
  const y = v => H - PAD - ((v - min) / span) * (H - 2 * PAD);

  // Group into runs of consecutive readings, then draw each run as its own
  // subpath. A run of one becomes a zero-length segment, which the round
  // linecap renders as a dot - otherwise an isolated reading would vanish.
  const runs = [];
  values.forEach((v, i) => {
    if (v == null) { runs.push(null); return; }
    const tail = runs[runs.length - 1];
    if (Array.isArray(tail)) tail.push(i); else runs.push([i]);
  });

  let d = '', lastIdx = -1;
  for (const run of runs) {
    if (!Array.isArray(run)) continue;
    const pt = i => `${x(i).toFixed(1)},${y(values[i]).toFixed(1)}`;
    d += 'M' + pt(run[0]);
    d += run.length === 1 ? 'L' + pt(run[0])
                          : run.slice(1).map(i => 'L' + pt(i)).join('');
    lastIdx = run[run.length - 1];
  }

  const label = `${series.source} · ${dates[0]} to ${dates[dates.length - 1]}: `
              + `low ${money(min)}, high ${money(max)}`;
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" `
       + `role="img" aria-label="${escapeHTML(label)}">`
       + `<title>${escapeHTML(label)}</title>`
       + `<path class="spark-line" d="${d}"/>`
       + `<circle class="spark-dot" cx="${x(lastIdx).toFixed(1)}" cy="${y(values[lastIdx]).toFixed(1)}" r="2.2"/>`
       + `</svg>`;
}

function deltaCell(delta, source) {
  if (!delta) return '<span class="delta na" title="Not enough price history yet">—</span>';
  const rounded = Math.round(delta.pct * 10) / 10;
  const tip = `${source} · 7 days: ${money(delta.from)} → ${money(delta.to)}`;
  if (rounded === 0) {
    return `<span class="delta flat" title="${escapeHTML(tip)}">0.0%</span>`;
  }
  const up = rounded > 0;
  const cls = up ? 'up' : 'down';
  const arrow = up ? '▲' : '▼';
  return `<span class="delta ${cls}" title="${escapeHTML(tip)}">`
       + `${arrow} ${up ? '+' : ''}${rounded.toFixed(1)}%</span>`;
}

function buildRows(cards, tabName, showTreatment) {
  return cards.map(c => {
    const tcg = c.tcg_price, mp = c.mp_price;
    const tcgBest = tcg != null && mp != null && tcg < mp;
    const mpBest  = tcg != null && mp != null && mp < tcg;
    const tcgCls = tcgBest ? ' class="best-price"' : '';
    const mpCls  = mpBest  ? 'best-price' : '';
    const nameCell = (c.image_url
      ? `<span class="card-link" data-tab="${tabName}" data-idx="${c._idx}">${escapeHTML(c.display_name)}</span>`
      : escapeHTML(c.display_name))
      // Only in the unioned view: under a chip every row would say the same.
      + (showTreatment
          ? `<span class="treatment">${escapeHTML(SECTION_LABEL[c._section] || '')}</span>`
          : '');

    const series = trendSeries(c);
    const trend = `<span class="trend">${sparkline(series)}`
                + `${deltaCell(trendDelta(series, TREND_DAYS), series && series.source)}</span>`;

    // data-label feeds the stacked mobile layout, where there is no header
    // row to read the column off. Inert on desktop. Each cell also carries a
    // class naming its column, which is what the mobile grid places by - the
    // layout used to key off nth-child, and inserting a column silently moved
    // every cell into the wrong slot.
    return `<tr>
      <td class="col-name">${nameCell}</td>
      <td class="col-num" data-label="#">${escapeHTML(collectorNumber(c))}</td>
      <td class="col-price col-tcg" data-label="TCG"><a href="${c.tcg_url}" target="_blank"${tcgCls}>${fmt(tcg)}</a></td>
      <td class="col-price col-mp" data-label="MP">${mp != null
        ? `<a href="${c.mp_url}" target="_blank" class="${mpCls}">${fmt(mp)}</a>`
        : `<a href="${c.mp_url}" target="_blank" class="na">N/A</a>`}</td>
      <td class="col-trend">${trend}</td>
      <td class="col-check col-nf" data-label="NF">${ownedCell(copies(c.collected_nonfoil))}</td>
      <td class="col-check col-foil" data-label="Foil">${ownedCell(copies(c.collected_foil))}</td>
    </tr>`;
  }).join('');
}

// Sort keys per column. Returns [primary, secondary] — secondary is tcg_price as tiebreaker.
function sortKey(col, c) {
  switch (col) {
    case 'name': return c.display_name.toLowerCase();
    // Numeric, or "10" sorts before "9". Collector numbers can carry a letter
    // suffix, so the parsed number leads and the raw string breaks ties -
    // keeping 234a next to 234 rather than adrift among the 2s.
    case 'num':  return parseInt(collectorNumber(c), 10) || 0;
    case 'tcg':  return c.tcg_price == null ? Infinity : c.tcg_price;
    case 'mp':   return c.mp_price  == null ? Infinity : c.mp_price;
    // Sorts by copies held, so the deepest stacks lead the "Collected first" view.
    case 'nf':   return copies(c.collected_nonfoil);
    case 'foil': return copies(c.collected_foil);
    // Cards without enough history sort to the bottom of the default (biggest
    // movers first) view rather than pretending to be flat at 0%.
    case 'trend': {
      const d = trendDelta(trendSeries(c), TREND_DAYS);
      return d ? d.pct : -Infinity;
    }
  }
}
function sortCards(cards, col, dir) {
  const sign = dir === 'asc' ? 1 : -1;
  return [...cards].sort((a, b) => {
    const va = sortKey(col, a), vb = sortKey(col, b);
    if (va < vb) return -1 * sign;
    if (va > vb) return  1 * sign;
    // tiebreaker: TCG price ascending
    const ta = a.tcg_price == null ? Infinity : a.tcg_price;
    const tb = b.tcg_price == null ? Infinity : b.tcg_price;
    return ta - tb;
  });
}

// Name search plus the collected/missing segmented control. Terms are ANDed so
// "sam gam" finds Samwise Gamgee. Only display_name is searched: for the cards
// that carry both a LOTR and an MTG name it already holds both, as
// "Flavor (Real Name)".
function filterCards(cards, f) {
  const terms = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  return cards.filter(c => {
    if (f.own !== 'all') {
      const owned = copies(c.collected_nonfoil) > 0 || copies(c.collected_foil) > 0;
      if (f.own === 'missing' ? owned : !owned) return false;
    }
    if (!terms.length) return true;
    const name = c.display_name.toLowerCase();
    return terms.every(t => name.includes(t));
  });
}

function emptyRow(f) {
  const why = f.q
    ? `No cards match “${escapeHTML(f.q)}”`
    : 'No cards in this set match that filter';
  return `<tr class="empty-row"><td colspan="${COLUMNS.length}">${why}</td></tr>`;
}

function updateHeaderIndicators(tabName) {
  const {col, dir} = state.sort[tabName];
  const arrow = dir === 'asc' ? '▲' : '▼';
  const panel = document.getElementById('tab-' + tabName);
  panel.querySelectorAll('thead th.sortable').forEach(th => {
    const isActive = th.dataset.col === col;
    th.classList.toggle('sort-active', isActive);
    th.querySelector('.sort-ind').textContent = isActive ? arrow : '';
  });
}

function money(n) {
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function buildSummary(cards) {
  let ownedVal = 0, ownedCount = 0, missCost = 0, missCount = 0, totalCards = cards.length;
  for (const c of cards) {
    const bp = bestPrice(c);
    const isOwned = copies(c.collected_nonfoil) > 0 || copies(c.collected_foil) > 0;
    if (isOwned) {
      ownedCount++;
      if (bp != null) ownedVal += bp;
    } else {
      missCount++;
      if (bp != null) missCost += bp;
    }
  }
  return `
    <div class="summary-card owned">
      <div class="summary-label">Current Collection Value
        <span class="summary-note">(${ownedCount} / ${totalCards} cards collected)</span></div>
      <div class="summary-value">${money(ownedVal)}</div>
    </div>
    <div class="summary-card missing">
      <div class="summary-label">Cost to Complete
        <span class="summary-note">(${missCount} card${missCount === 1 ? '' : 's'} missing)</span></div>
      <div class="summary-value">${money(missCost)}</div>
    </div>`;
}

function renderTab(tabName) {
  const f = state.filter[tabName];
  const {col, dir} = state.sort[tabName];
  const cards = scopeCards(tabName);
  const shown = filterCards(cards, f);
  const sorted = sortCards(shown, col, dir);
  const subs = sectionsOf(tabName);
  const showTreatment = !f.subset && subs.length > 1;

  document.getElementById('tbody-' + tabName).innerHTML =
    sorted.length ? buildRows(sorted, tabName, showTreatment) : emptyRow(f);
  // The summary describes the scope, not the view: filtering to one card
  // should not claim the set is worth $4. It follows the chip - which is what
  // makes "All" worth having, since the set-wide rollup exists nowhere else -
  // but ignores the search box and the collected control.
  document.getElementById('summary-' + tabName).innerHTML = buildSummary(cards);

  // The chip labels carry their own totals, so the size of each treatment is
  // readable without visiting it.
  for (const s of subs) {
    const n = document.getElementById('chipn-' + s.key);
    if (n) n.textContent = (state.cards[tabName] || [])
      .filter(c => c._section === s.key).length;
  }

  const count = document.getElementById('count-' + tabName);
  const filtered = shown.length !== cards.length;
  count.textContent = filtered
    ? `Showing ${shown.length} of ${cards.length}`
    : `${cards.length} card${cards.length === 1 ? '' : 's'}`;
  count.classList.toggle('filtered', filtered);

  updateHeaderIndicators(tabName);
  syncSortSelect(tabName);
}

// Keeps the mobile control honest when the sort was set by a header click —
// a column the select cannot express (ManaPool, Foil) clears it rather than
// leaving a stale option looking selected.
function syncSortSelect(tabName) {
  const sel = document.getElementById('sort-' + tabName);
  if (!sel) return;
  const {col, dir} = state.sort[tabName];
  const val = `${col}:${dir}`;
  sel.selectedIndex = SORT_OPTIONS.findIndex(o => o.val === val);
}

function handleSortClick(tabName, col) {
  const s = state.sort[tabName];
  if (s.col === col) {
    s.dir = s.dir === 'asc' ? 'desc' : 'asc';
  } else {
    s.col = col;
    // Sensible default direction per column
    s.dir = (col === 'nf' || col === 'foil' || col === 'trend') ? 'desc' : 'asc';
  }
  renderTab(tabName);
}

function wireSortHeaders() {
  document.querySelectorAll('thead th.sortable').forEach(th => {
    const panel = th.closest('.tab-panel');
    const tabName = panel.id.replace('tab-', '');
    th.addEventListener('click', () => handleSortClick(tabName, th.dataset.col));
  });
}

function showCard(tabName, idx, viaHover) {
  const card = (state.cards[tabName] || []).find(c => c._idx === idx);
  if (!card || !card.image_url) return;
  document.getElementById('modal-img').src = card.image_url;
  document.getElementById('modal-img').alt = card.display_name;
  document.getElementById('modal-caption').textContent = card.display_name;
  const modal = document.getElementById('card-modal');
  modal.classList.add('open');
  // A hover preview is transient and click-through; a clicked one is interactive.
  modal.classList.toggle('hover-preview', !!viaHover);
}

function closeModal(e, force) {
  if (!force && e && e.target.closest('.modal-inner')) return;
  document.getElementById('card-modal').classList.remove('open');
}

// Both data files are regenerated once a day and must never be shown stale -
// yesterday's prices under today's date is the one wrong answer this page can
// give. That used to be enforced with a `?_=' + Date.now()` cache-buster,
// which made every URL unique and so re-downloaded ~1.2MB on every single
// visit, revisits included.
//
// `no-cache` is the exact rule that was wanted: always revalidate, never serve
// from cache blind. GitHub Pages already sends ETag and Last-Modified, so an
// unchanged file answers 304 with no body - a few hundred bytes instead of the
// whole thing - and the moment the daily run commits new data the ETag differs
// and the full file arrives. Note this is not `no-store`: the copy is kept and
// reused, it is just never trusted without asking.
const DATA_FETCH = { cache: 'no-cache' };

// History is optional: if it is missing or malformed the tables still render,
// with the trend column showing that there is nothing to plot yet.
async function loadHistory() {
  try {
    const r = await fetch('history.json', DATA_FETCH);
    if (!r.ok) return null;
    const h = await r.json();
    return (h && Array.isArray(h.dates) && h.cards) ? h : null;
  } catch (e) {
    return null;
  }
}

async function loadPrices() {
  try {
    const [r, history] = await Promise.all([
      fetch('prices.json', DATA_FETCH),
      loadHistory(),
    ]);
    state.history = history;
    const data = await r.json();

    const nav = deriveNav(data);
    GROUPS = nav.groups;
    SECTIONS = nav.sections;
    SECTION_LABEL = Object.fromEntries(SECTIONS.map(s => [s.key, s.label]));
    buildScaffold(GROUPS);
    wireSortHeaders();

    // A section the data does not carry renders as empty rather than throwing:
    // the page and prices.json deploy independently, so the page can be a set
    // ahead of the data for a few minutes after a definition change.
    for (const s of SECTIONS) {
      if (!Array.isArray(data[s.key])) data[s.key] = [];
    }
    state.data = data;
    // Flatten once per group rather than per render; _idx is assigned here and
    // the modal looks cards up by it.
    state.cards = Object.fromEntries(groupKeys().map(k => [k, groupCards(k)]));

    groupKeys().forEach(renderTab);
    applyHash();

    const ts = new Date(data.updated_at);
    // Both times render in the reader's timezone, so the zone is named once on
    // the timestamp and the schedule inherits it rather than repeating it.
    document.getElementById('last-updated').innerHTML =
      'Last updated: ' + escapeHTML(ts.toLocaleString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
      }))
      + ` <span class="schedule">(scheduled daily refresh at `
      + `${escapeHTML(refreshSchedule())})</span>`;
  } catch (e) {
    document.getElementById('last-updated').textContent = 'Could not load prices.json';
  }
}

// Matches on the button's own data-tab rather than its position, so the tab
// bar and the panels can never drift out of step.
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  for (const key of groupKeys()) {
    document.getElementById('tab-' + key).classList.toggle('active', key === name);
  }
}

// Selects a chip within a group. '' is the unioned "All" view.
function selectSubset(groupKey, subKey) {
  state.filter[groupKey].subset = subKey;
  const row = document.querySelector(`.chips[data-tab="${CSS.escape(groupKey)}"]`);
  if (row) row.querySelectorAll('.chip').forEach(b => {
    const on = b.dataset.sub === subKey;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  });
  renderTab(groupKey);
}

// ---- Routing ---------------------------------------------------------------
// The view lives in the hash as #group or #group/section. With this many views
// a refresh that always dumped you back on the first set gets old fast, and a
// link to one treatment is worth being able to send. The back button works
// because switching writes a history entry.
function currentView() {
  const g = document.querySelector('.tab-btn.active');
  const key = g ? g.dataset.tab : (groupKeys()[0] || '');
  const sub = key && state.filter[key] ? state.filter[key].subset : '';
  return { group: key, sub };
}

function updateHash() {
  const { group, sub } = currentView();
  if (!group) return;
  const want = '#' + group + (sub ? '/' + sub : '');
  if (location.hash !== want) location.hash = want;
}

// Reads the hash and moves to it. Anything unrecognised - a stale bookmark, a
// section that has since been renamed - falls back to the first group rather
// than leaving the page on nothing.
function applyHash() {
  if (!GROUPS.length) return;
  const [rawGroup, rawSub] = decodeURIComponent(location.hash.slice(1)).split('/');
  const group = groupKeys().includes(rawGroup) ? rawGroup : groupKeys()[0];
  // A group with one section has no chips, so naming that section in the hash
  // would select something the page shows no control for - and select exactly
  // what "All" already shows.
  const subs = sectionsOf(group);
  const sub = subs.length > 1 && subs.some(s => s.key === rawSub) ? rawSub : '';

  const now = currentView();
  if (now.group !== group) switchTab(group);
  if (now.sub !== sub || now.group !== group) selectSubset(group, sub);
}

// ---- Theme -----------------------------------------------------------------
// The class on <html> is the single source of truth; the head script sets it
// before first paint and everything here only keeps it and the button in step.
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

function storedTheme() {
  try { return localStorage.getItem('theme'); } catch (e) { return null; }
}

function applyTheme(dark, remember) {
  document.documentElement.classList.toggle('dark', dark);
  if (remember) {
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) { /* private mode */ }
  }
  const btn = document.getElementById('theme-btn');
  // The button names what it will do, not what is on - so it reads "Light"
  // while the dark theme is showing.
  btn.querySelector('.theme-icon').innerHTML = dark ? '&#9788;' : '&#9789;';
  btn.querySelector('.theme-label').textContent = dark ? 'Light' : 'Dark';
  btn.setAttribute('aria-pressed', String(dark));
  btn.title = dark ? 'Switch to the light theme' : 'Switch to the dark theme';
}

window.addEventListener('DOMContentLoaded', () => {
  loadPrices();   // builds the scaffold, then wires the sort headers

  applyTheme(document.documentElement.classList.contains('dark'), false);
  document.getElementById('theme-btn').addEventListener('click', () => {
    applyTheme(!document.documentElement.classList.contains('dark'), true);
  });
  // Follow the OS while the choice is still the OS's to make; an explicit
  // click opts out of this for good.
  darkQuery.addEventListener('change', (e) => {
    if (!storedTheme()) applyTheme(e.matches, false);
  });

  // Tab buttons are generated, so listen on the bar rather than each button.
  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    switchTab(btn.dataset.tab);
    updateHash();
  });

  // Back/forward, and a hash typed or pasted into the address bar.
  window.addEventListener('hashchange', applyHash);

  // Same for the per-tab sort selects.
  const panels = document.getElementById('panels');

  // Subset chips.
  panels.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    selectSubset(chip.closest('.chips').dataset.tab, chip.dataset.sub);
    updateHash();
  });
  panels.addEventListener('change', (e) => {
    const sel = e.target.closest('.mobile-sort select');
    if (!sel) return;
    const [col, dir] = sel.value.split(':');
    state.sort[sel.dataset.tab] = { col, dir };
    renderTab(sel.dataset.tab);
  });

  // Filter box. `input` rather than `change` so the table narrows as you type;
  // the largest set is 193 rows, which re-renders well inside a keystroke.
  panels.addEventListener('input', (e) => {
    const box = e.target.closest('.filter-q');
    if (!box) return;
    state.filter[box.dataset.tab].q = box.value.trim();
    renderTab(box.dataset.tab);
  });

  // Collected/missing segmented control.
  panels.addEventListener('click', (e) => {
    const btn = e.target.closest('.own-toggle button');
    if (!btn) return;
    const tabName = btn.closest('.own-toggle').dataset.tab;
    state.filter[tabName].own = btn.dataset.own;
    btn.parentElement.querySelectorAll('button').forEach(b => {
      const on = b === btn;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', String(on));
    });
    renderTab(tabName);
  });

  // Card image preview via event delegation
  let hoverTimer = null;
  const previewCard = (e) => {
    const link = e.target.closest('.card-link');
    if (!link) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => {
      showCard(link.dataset.tab, Number(link.dataset.idx), true);
    }, 750);
  };

  document.addEventListener('click', (e) => {
    const link = e.target.closest('.card-link');
    if (link) showCard(link.dataset.tab, Number(link.dataset.idx), false);
  });

  // Hover preview only where there is a real hovering pointer. A tap emits a
  // synthetic mouseover as well as a click, so on touch the timer would
  // re-open the just-clicked modal as a hover preview — which is
  // pointer-events:none, and mouseout never arrives to dismiss it. The result
  // is a modal that swallows nothing and cannot be closed.
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    document.addEventListener('mouseover', previewCard);

    document.addEventListener('mouseout', (e) => {
      const link = e.target.closest('.card-link');
      if (!link) return;
      clearTimeout(hoverTimer);
      // Only auto-dismiss a hover preview — a clicked one stays until dismissed.
      const modal = document.getElementById('card-modal');
      if (!modal.classList.contains('hover-preview')) return;
      const related = e.relatedTarget;
      if (!related || !link.contains(related)) closeModal(null, true);
    });
  }

  // ESC closes modal
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal(null, true);
  });
});
</script>

</body>
</html>
